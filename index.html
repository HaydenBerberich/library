<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link href="./style.css" rel="stylesheet">
</head>
<body>
    <h1>Library</h1>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Author</th>
                <th>Pages</th>
                <th>Status</th>
                <th>Change Status</th>
                <th>Delete</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    <button id="new">New Book</button>
    <dialog>
        <form id="add" novalidate>
            <label for="name">Name:</label>
            <input id="name" type="text" required>
            <span class="error" id="name-error"></span>
            
            <label for="author">Author:</label>
            <input id="author" type="text" required>
            <span class="error" id="author-error"></span>

            <label for="pages">Pages:</label>
            <input id="pages" type="number" required>
            <span class="error" id="pages-error"></span>

            <input id="status" type="checkbox">
            <label for="status">Read</label>

            <button>Add</button>
        </form>
    </dialog>
    <script src="./script.js"></script>
</body>
</html>
